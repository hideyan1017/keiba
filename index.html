<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>レーシングプログラム - 試合時間</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Hiragino Sans', 'Meiryo', sans-serif;
        }

        body {
            background-color: #0b2b18;
            color: #fff;
            display: flex;
            justify-content: center;
            padding: 15px;
            background-image: radial-gradient(#144d2b 15%, transparent 16%);
            background-size: 20px 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: #111a14;
            border: 3px solid #d4af37;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            overflow: hidden;
        }

        /* アクセスカウンターエリア */
        .access-counter {
            background-color: #000;
            padding: 6px 15px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid #333;
            font-size: 0.8rem;
            color: #aaa;
        }

        .counter-badge {
            background: #222;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            font-size: 0.95rem;
            padding: 2px 8px;
            border-radius: 3px;
            border: 1px solid #00ff66;
            letter-spacing: 2px;
            text-shadow: 0 0 5px rgba(0,255,102,0.6);
        }

        .header {
            background: linear-gradient(135deg, #1b5e20, #0d3b13);
            text-align: center;
            padding: 15px 10px;
            border-bottom: 2px solid #d4af37;
        }

        .header h1 {
            font-size: 1.4rem;
            color: #fff;
            letter-spacing: 2px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .tab-buttons {
            display: flex;
            background-color: #000;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            background-color: #222;
            color: #888;
            cursor: pointer;
            transition: all 0.2s;
            border-bottom: 3px solid #444;
        }

        .tab-btn.active {
            background-color: #d4af37;
            color: #000;
            border-bottom: 3px solid #fff;
            text-shadow: 0 0 2px rgba(255,255,255,0.5);
        }

        .tab-btn.disabled {
            background-color: #1a1a1a;
            color: #555;
            cursor: not-allowed;
            border-bottom: 3px solid #222;
            text-decoration: line-through;
        }

        .schedule-list {
            display: none;
            padding: 12px;
            flex-direction: column;
            gap: 10px;
        }

        .schedule-list.active {
            display: flex;
        }

        .closed-box {
            text-align: center;
            padding: 40px 20px;
            background: #161f18;
            border: 1px dashed #444;
            border-radius: 4px;
            color: #aaa;
        }

        .closed-box p {
            font-size: 1.1rem;
            font-weight: bold;
            color: #e74c3c;
            margin-bottom: 8px;
        }

        /* レースカード（タップ可能） */
        .race-card {
            display: flex;
            align-items: center;
            background: #1c2820;
            border: 1px solid #2d4233;
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
            position: relative;
        }

        .race-card:hover {
            transform: scale(1.01);
            border-color: #d4af37;
        }

        .race-num {
            width: 75px;
            padding: 12px 5px;
            text-align: center;
            font-weight: bold;
            font-size: 0.95rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            line-height: 1.1;
        }

        .race-num span {
            font-size: 1.3rem;
            font-weight: 900;
        }

        .waku-1 { background-color: #ffffff; color: #000; }
        .waku-2 { background-color: #222222; color: #fff; border-right: 1px solid #444; }
        .waku-3 { background-color: #d32f2f; color: #fff; }
        .waku-4 { background-color: #1976d2; color: #fff; }
        .waku-5 { background-color: #fbc02d; color: #000; }

        .race-card.special-g1 {
            border: 2px solid #ffd700;
            background: linear-gradient(135deg, #3a2500, #1c2820);
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.4);
        }

        .race-card.special-g1 .race-num {
            background: linear-gradient(135deg, #ffe066, #d4af37);
            color: #000;
            text-shadow: none;
        }

        .race-info {
            flex: 1;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .race-name {
            font-size: 1.1rem;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .special-g1 .race-name {
            color: #ffd700;
            text-shadow: 0 0 5px rgba(255,215,0,0.5);
        }

        .time-label {
            font-size: 0.75rem;
            color: #aaa;
            margin-bottom: 2px;
            text-align: right;
        }

        .race-time {
            font-size: 1.35rem;
            font-weight: bold;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            text-shadow: 0 0 8px rgba(0,255,102,0.6);
        }

        .special-g1 .race-time {
            color: #ff3366;
            text-shadow: 0 0 8px rgba(255,51,102,0.8);
        }

        /* フッター・コピーライト表示 */
        .footer-copyright {
            background-color: #000;
            color: #888;
            text-align: center;
            padding: 10px;
            font-size: 0.8rem;
            border-top: 1px solid #2d4233;
            letter-spacing: 0.5px;
        }

        /* --- アニメ公式風 モーダルポップアップ --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.88);
            backdrop-filter: blur(6px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            padding: 15px;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: #111a14;
            border: 2px solid #d4af37;
            border-radius: 12px;
            width: 100%;
            max-width: 440px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.4);
            transform: scale(0.85);
            transition: transform 0.3s ease;
            position: relative;
        }

        .modal-overlay.active .modal-content {
            transform: scale(1);
        }

        .modal-header {
            background: linear-gradient(135deg, #1b5e20, #0d3b13);
            padding: 12px 15px;
            border-bottom: 1px solid #d4af37;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: #ffd700;
        }

        .modal-close {
            background: none;
            border: none;
            color: #fff;
            font-size: 1.8rem;
            cursor: pointer;
            line-height: 1;
        }

        .modal-body {
            padding: 15px;
        }

        /* 画像スライダー */
        .slider-wrapper {
            position: relative;
            width: 100%;
            height: 200px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #3d5243;
            background: #000;
        }

        .slider-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.3s ease;
        }

        .slider-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.6);
            color: #ffd700;
            border: 1px solid #d4af37;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: background 0.2s;
        }

        .slider-btn:hover {
            background: rgba(212, 175, 55, 0.8);
            color: #000;
        }

        .slider-btn.prev { left: 8px; }
        .slider-btn.next { right: 8px; }

        /* ドットインジケーター */
        .dots-container {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin: 10px 0;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #444;
            transition: all 0.3s;
        }

        .dot.active {
            background: #ffd700;
            transform: scale(1.3);
        }

        /* ステータスエリア */
        .status-card {
            background: #18241b;
            border: 1px solid #2d4233;
            border-radius: 6px;
            padding: 12px;
            margin-top: 5px;
        }

        .status-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            padding-bottom: 6px;
            margin-bottom: 10px;
        }

        .photo-title {
            font-size: 0.95rem;
            font-weight: bold;
            color: #00ff66;
        }

        .photo-count {
            font-size: 0.8rem;
            color: #aaa;
        }

        /* パラメーターバー */
        .stat-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .stat-row {
            display: flex;
            align-items: center;
            font-size: 0.8rem;
        }

        .stat-label {
            width: 70px;
            color: #ccc;
            font-weight: bold;
        }

        .stat-bar-bg {
            flex: 1;
            height: 10px;
            background: #0d140f;
            border-radius: 5px;
            overflow: hidden;
            margin: 0 10px;
            border: 1px solid #333;
        }

        .stat-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #1b5e20, #00ff66);
            width: 0%;
            transition: width 0.4s ease;
            border-radius: 5px;
        }

        .stat-val {
            width: 35px;
            text-align: right;
            font-weight: bold;
            color: #ffd700;
            font-family: 'Courier New', Courier, monospace;
        }
    </style>
</head>

    try {
        // CountAPI を呼び出してカウントを +1 加算（Hit）する
        const response = await fetch(`https://api.countapi.xyz/hit/${namespace}/${key}`);
        
        if (!response.ok) throw new Error('API Request Failed');
        
        const data = await response.json();
        const count = data.value;

        // 6桁のゼロパディング表示 (例: 000042)
        const formattedCount = String(count).padStart(6, '0');
        counterElement.innerText = formattedCount;
    } catch (error) {
        console.error('アクセスカウンターの取得に失敗しました:', error);
        
        // エラー時（オフライン時など）はフォールバックとして localStorage を使用
        let localCount = localStorage.getItem('race_page_access_count') || 0;
        localCount = parseInt(localCount) + 1;
        localStorage.setItem('race_page_access_count', localCount);
        counterElement.innerText = String(localCount).padStart(6, '0');
    }
})();
        // --- 日付切替 ---
        function switchDay(day) {
            if (day !== 2) return;
            document.getElementById('day1').classList.remove('active');
            document.getElementById('day2').classList.add('active');
        }

        // --- モーダルオープン ---
        function openRaceModal(raceIdx) {
            currentRaceIndex = raceIdx;
            currentPhotoIndex = 0;

            const race = raceData[raceIdx];
            document.getElementById('modal-title').innerText = race.title;

            // ドットの生成
            const dotsContainer = document.getElementById('dots-container');
            dotsContainer.innerHTML = '';
            race.photos.forEach((_, idx) => {
                const dot = document.createElement('div');
                dot.className = `dot ${idx === 0 ? 'active' : ''}`;
                dotsContainer.appendChild(dot);
            });

            updateSlideDisplay();
            document.getElementById('modal-overlay').classList.add('active');
        }

        // --- スライド切り替え ---
        function changeSlide(direction) {
            const photos = raceData[currentRaceIndex].photos;
            currentPhotoIndex += direction;

            if (currentPhotoIndex < 0) {
                currentPhotoIndex = photos.length - 1;
            } else if (currentPhotoIndex >= photos.length) {
                currentPhotoIndex = 0;
            }

            updateSlideDisplay();
        }

        // --- スライド＆ステータス更新表示 ---
        function updateSlideDisplay() {
            const photo = raceData[currentRaceIndex].photos[currentPhotoIndex];

            // 画像セット
            document.getElementById('slider-img').src = photo.url;

            // 写真情報
            document.getElementById('photo-title').innerText = photo.name;
            document.getElementById('photo-count').innerText = `${currentPhotoIndex + 1} / ${raceData[currentRaceIndex].photos.length}`;

            // ステータス更新 (ゲージ幅 ＆ 数値)
            document.getElementById('bar-speed').style.width = photo.speed + '%';
            document.getElementById('val-speed').innerText = photo.speed;

            document.getElementById('bar-stamina').style.width = photo.stamina + '%';
            document.getElementById('val-stamina').innerText = photo.stamina;

            document.getElementById('bar-power').style.width = photo.power + '%';
            document.getElementById('val-power').innerText = photo.power;

            // ドットのアクティブ状態更新
            const dots = document.querySelectorAll('.dot');
            dots.forEach((dot, idx) => {
                if (idx === currentPhotoIndex) {
                    dot.classList.add('active');
                } else {
                    dot.classList.remove('active');
                }
            });
        }

        // --- モーダルクローズ ---
        function closeModal(event, isBtn = false) {
            if (isBtn || event.target.id === 'modal-overlay') {
                document.getElementById('modal-overlay').classList.remove('active');
            }
        }
    </script>
</body>
</html>
